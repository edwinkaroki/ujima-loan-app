version: '3.8'
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - FRONTEND_ORIGIN=http://localhost
    expose:
      - "8000"

  web:
    image: nginx:stable
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
